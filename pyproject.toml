[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "maxsim-pruning-bench"
version = "0.2.0"
description = "Reproducible audits and reference controls for coarse MaxSim filtering"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
license = "MIT"
readme = "README.md"

[project.optional-dependencies]
report = ["matplotlib>=3.8"]
gpu = ["torch>=2.6", "triton>=3.2; sys_platform == 'linux'"]

[tool.setuptools.packages.find]
where = ["src"]
