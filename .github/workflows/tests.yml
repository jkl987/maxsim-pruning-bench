name: CPU audits
on: [push, pull_request]
permissions:
  contents: read
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -O -m unittest discover -s tests -v
      - run: python -O scripts/recompute.py
      - run: python scripts/demo_cpu.py
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[report]'
      - run: python scripts/render_report.py --output run-output/report
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-report
          path: run-output/report/
          retention-days: 14
