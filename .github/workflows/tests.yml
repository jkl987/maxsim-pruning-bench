name: CPU audits
on: [push, pull_request]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/recompute.py
      - run: python scripts/demo_cpu.py
